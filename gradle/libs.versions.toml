[versions]
agp = "9.1.0"
xposed-api = "82"
libxposed-api = "101.0.0"
kotlin = "2.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
annotation = "1.9.1"
material = "1.13.0"
jetbrainsKotlinJvm = "2.3.0"
maven-publish = "0.35.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed-api" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
